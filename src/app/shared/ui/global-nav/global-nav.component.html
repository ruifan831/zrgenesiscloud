<nav class="global-nav" [class.global-nav--scrolled]="isScrolled()" aria-label="主导航" (keydown.escape)="closeMobileMenu()">
  <div class="global-nav__inner">
    <a routerLink="/" class="global-nav__logo" aria-label="ZRGenesis 首页" (click)="closeMobileMenu()">ZRGenesis<span>.</span></a>
    <ul class="global-nav__links">
      <li><a routerLink="/" fragment="benefits" class="global-nav__link" (click)="closeMobileMenu()">福利活动</a></li>
      <li><a routerLink="/" fragment="apps" class="global-nav__link" (click)="closeMobileMenu()">我们的应用</a></li>
      <li class="global-nav__desktop"><a routerLink="/" fragment="about" class="global-nav__link">关于我们</a></li>
      <li class="global-nav__desktop"><a routerLink="/contact" class="global-nav__link global-nav__contact" routerLinkActive="global-nav__link--active">联系我们 <span aria-hidden="true">↗</span></a></li>
    </ul>
    <button type="button" class="global-nav__hamburger" [attr.aria-expanded]="mobileMenuOpen()" aria-controls="mobile-menu" [attr.aria-label]="mobileMenuOpen() ? '关闭菜单' : '打开菜单'" (click)="toggleMobileMenu()"><span></span><span></span></button>
  </div>
  <div id="mobile-menu" class="global-nav__mobile-menu" [class.global-nav__mobile-menu--open]="mobileMenuOpen()" [attr.inert]="mobileMenuOpen() ? null : ''" aria-label="移动端菜单">
    <ul>
      <li *ngFor="let app of apps$ | async"><a [routerLink]="['/apps', app.slug]" (click)="closeMobileMenu()">{{ app.name }}</a></li>
      <li><a routerLink="/" fragment="about" (click)="closeMobileMenu()">关于我们</a></li>
      <li><a routerLink="/privacy" (click)="closeMobileMenu()">隐私与协议</a></li>
      <li><a routerLink="/contact" (click)="closeMobileMenu()">联系我们</a></li>
    </ul>
  </div>
</nav>
