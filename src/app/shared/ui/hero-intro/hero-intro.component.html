<section class="hero-intro" [class.hero-intro--text-only]="!apps.length">
  <div class="hero-intro__inner">
    <div class="hero-intro__copy">
      <p class="hero-intro__eyebrow">让每一天，更从容。</p>
      <h1 class="hero-intro__title">精心打造<br>每一款应用。</h1>
      <p class="hero-intro__subtitle">专注生活里的真实需要，<br>把日常小事，做得更好。</p>
      <div class="hero-intro__ctas">
        <a class="hero-intro__btn" [attr.href]="'#' + appsAnchor">{{ primaryLabel }} <span aria-hidden="true">↓</span></a>
        <a *ngIf="featuredAppSlug && featuredAppLabel" class="hero-intro__secondary" [routerLink]="['/apps', featuredAppSlug]">{{ featuredAppLabel }}</a>
      </div>
    </div>
    <div *ngIf="apps.length" class="hero-intro__apps" aria-label="应用速览">
      <a *ngFor="let app of apps | slice:0:3; let i = index" class="hero-intro__app" [routerLink]="['/apps', app.slug]">
        <ui-product-image *ngIf="app.logoImage || app.heroImage" [src]="app.logoImage || app.heroImage" [alt]="app.name + ' 图标'" [aspect]="1"></ui-product-image>
        <div><h2>{{ app.name }}</h2><p>{{ app.tagline }}</p></div>
        <span class="hero-intro__arrow" aria-hidden="true">↗</span>
      </a>
      <p class="hero-intro__note">每一款应用，都从一个真实需要开始。</p>
    </div>
  </div>
</section>
