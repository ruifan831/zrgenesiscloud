<div id="privacy-terms" class="legal-links">
  <p class="legal-links__text">
    使用前请阅读

    <ng-container *ngIf="privacyUrl; else noPrivacy">
      <a [href]="privacyUrl" class="legal-links__link">
        《{{ appName || '应用' }}隐私政策》
      </a>
    </ng-container>
    <ng-template #noPrivacy>
      <a routerLink="/privacy" class="legal-links__link">《隐私政策》</a>
    </ng-template>

    和

    <ng-container *ngIf="termsUrl; else noTerms">
      <a [href]="termsUrl" class="legal-links__link">《用户协议》</a>
    </ng-container>
    <ng-template #noTerms>
      <span class="legal-links__placeholder">用户协议暂未公布</span>
    </ng-template>
  </p>
</div>
