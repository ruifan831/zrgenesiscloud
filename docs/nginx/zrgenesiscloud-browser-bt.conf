server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name www.zrgenesiscloud.com zrgenesiscloud.com;
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/zrgenesiscloud.com;
    include /www/server/panel/vhost/nginx/extension/zrgenesiscloud.com/*.conf;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除并保持这段设置在优先级高的位置
    include /www/server/panel/vhost/nginx/well-known/zrgenesiscloud.com.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/zrgenesiscloud.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/zrgenesiscloud.com/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    error_page 497  https://$host$request_uri;

    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/html_zrgenesiscloud.com.conf;
    #REWRITE-END

    # ====================================================================
    # Passkey / Universal Link / App Links 配置文件
    # 必须放在 location / 之前，且用 `=` 精确匹配
    # 文件位置: /www/wwwroot/zrgenesiscloud.com/.well-known/
    # ====================================================================
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type "application/json" always;
        try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
        types {}
        default_type application/json;
        add_header Content-Type "application/json" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }





    location /privacy/shanyin {
        alias /www/wwwroot/zrgenesiscloud.com/privacy-policy-shanyin.html;
        add_header Content-Type text/html;
    }

    location ^~ /remote/ {
      proxy_pass https://static.doonook.com;
      proxy_ssl_server_name on;
      proxy_ssl_name static.doonook.com;

      proxy_set_header Host static.doonook.com;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      add_header X-Debug-Proxy "remote-static" always;
    }

    location /static/apps/ {
      proxy_pass https://www.doonook.com/static/apps/;
      proxy_ssl_server_name on;
      proxy_ssl_name www.doonook.com;
      proxy_set_header Host www.doonook.com;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }


    # 原 admin 入口停用，不落入官网 SPA 回退
    location = /admin {
        return 404;
    }
    location ^~ /admin/ {
        return 404;
    }

    # API endpoints
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    location /api/ {
        set $doonook_host api.doonook.com;
        proxy_pass https://$doonook_host$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name $doonook_host;

        proxy_http_version 1.1;          # ← 加这行
        proxy_set_header Connection "";  # ← 顺手加这行，启用 keepalive 复用

        proxy_set_header Host $doonook_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 300m;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /ws {
        proxy_pass https://www.doonook.com/ws;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;

        proxy_set_header Host www.doonook.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # 提词器大师预渲染法律页：仅从 browser 读取，缺失时返回 404
    location ~ ^/legal/[a-z0-9-]+/[^/]+/?$ {
        root /www/wwwroot/zrgenesiscloud.com/browser;
        index index.html;
        try_files $uri $uri/ =404;
        expires -1;
    }

    # 官网使用 browser；顶部 root 保留供验证文件及旧内容使用
    location / {
        root /www/wwwroot/zrgenesiscloud.com/browser;
        try_files $uri $uri/ /index.html;
    }

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        root /www/wwwroot/zrgenesiscloud.com/browser;
        expires      30d;
        access_log  /dev/null;
		error_log  /dev/null;
				#Monitor-Config-Start 网站监控报表日志发送配置
				access_log syslog:server=unix:/tmp/bt-monitor.sock,nohostname,tag=2__access monitor;
				error_log syslog:server=unix:/tmp/bt-monitor.sock,nohostname,tag=2__error;
				#Monitor-Config-End
    }

    location ~ .*\\.(js|css)?$
    {
        root /www/wwwroot/zrgenesiscloud.com/browser;
        expires      12h;
        access_log  /dev/null;
		error_log  /dev/null;
				#Monitor-Config-Start 网站监控报表日志发送配置
				access_log syslog:server=unix:/tmp/bt-monitor.sock,nohostname,tag=2__access monitor;
				error_log syslog:server=unix:/tmp/bt-monitor.sock,nohostname,tag=2__error;
				#Monitor-Config-End
    }
    access_log  /www/wwwlogs/zrgenesiscloud.com.log;
    error_log  /www/wwwlogs/zrgenesiscloud.com.error.log;

    #Monitor-Config-Start 网站监控报表日志发送配置
    access_log syslog:server=unix:/tmp/bt-monitor.sock,nohostname,tag=2__access monitor;
    error_log syslog:server=unix:/tmp/bt-monitor.sock,nohostname,tag=2__error;
    #Monitor-Config-End
}
