<div class="product-image__wrapper" [style.aspect-ratio]="aspect ? aspect : null">
  <img
    *ngIf="src && !failed"
    class="product-image__img"
    [src]="src"
    [alt]="alt"
    loading="lazy"
    decoding="async"
    (error)="failed = true"
  />
  <div *ngIf="!src || failed" class="product-image__placeholder" role="img" [attr.aria-label]="alt">{{ alt || '应用图片' }}</div>
</div>
