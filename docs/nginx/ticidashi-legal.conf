# Merge into the existing HTTPS server block; keep SSL and /api/ configuration.
# Replace the existing root and location / rather than adding duplicates.
root /www/wwwroot/zrgenesiscloud.com/browser;
index index.html;

# Static legal pages: never fall back to an empty Angular shell for a missing document.
location ~ ^/legal/[a-z0-9-]+/[^/]+/?$ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}



location / {
    try_files $uri $uri/ /index.html;
}

# Remove any old proxy_pass http://127.0.0.1:4100 for legal pages.
# Node, package.json and node_modules are not required on the production server.
