# Merge into the existing website server block whose root serves the Angular browser build.
# Preserve the existing API, static legal pages, SSL and other locations.
# /privacy is an Angular route but the build also contains a privacy/ directory.
# Serve the SPA explicitly to avoid a directory-index 403 on direct visits.
location = /privacy { try_files /index.html =404; }
location = /privacy/ { try_files /index.html =404; }
